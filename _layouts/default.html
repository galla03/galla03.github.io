<!DOCTYPE html>
<html>
  <head>
    <title>{{ page.title | default: site.title }}</title>
    <meta name="author" content="{{ site.author }}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ page.description | default: site.description }}">
    {% if site.bg_color == "dark" %}
    <meta name="theme-color" content="#13171F" />
    {% endif %}
    <meta name="color-scheme" content="light dark" />
    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:title" content="{{ page.title | default: site.title }}">
    <meta property="og:description" content="{{ page.description | default: site.description }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ site.url }}{{ page.url }}">

    <!-- Twitter Card -->
    <meta name="twitter:title" content="{{ page.title | default: site.title }}">
    <meta name="twitter:description" content="{{ page.description | default: site.description }}">

    <!-- link rel="icon" type = "image/x-icon" href="/favicon.ico" || type="image/png" href="{{ "assets/img/favicon.png" | relative_url }}" (if I ever add logo)-->
  </head>

  <body>
    <div class= "topics-bar">
      <a class="button" href="#">matemàtiques</a>
      <a class="button" href="#">humanitats i societat</a> 
      <a class="button" href="#">medi ambient</a> 
      <a class="button" href="#">demografia</a> 
    </div>
    <div class = "latest">
      <h1>Some aritcle title</h1>
    </div>
  </body>
</html>
